<main class="login-page">
  <section class="brand-panel">
    <div class="brand-mark">ICAO</div>
    <h1>Portal de Cursos</h1>
    <p>Acesse suas aulas, materiais e trilhas de aprendizagem.</p>
  </section>

  <mat-card class="login-card">
    <header class="login-card__header">
      <span class="eyebrow">{{ mode === 'register' ? 'Criar conta' : 'Entrar' }}</span>
      <h2>{{ mode === 'register' ? 'Contrate seu acesso' : 'Acesse sua conta' }}</h2>
    </header>

    <div class="mode-switch" role="tablist" aria-label="Tipo de acesso">
      <button
        type="button"
        role="tab"
        [class.mode-switch__button--active]="mode === 'login'"
        [attr.aria-selected]="mode === 'login'"
        (click)="switchMode('login')"
      >
        Entrar
      </button>
      <button
        type="button"
        role="tab"
        [class.mode-switch__button--active]="mode === 'register'"
        [attr.aria-selected]="mode === 'register'"
        (click)="switchMode('register')"
      >
        Criar conta
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <label class="field" *ngIf="mode === 'register'">
        <span class="field__label">Nome completo</span>
        <span class="field__control">
          <mat-icon aria-hidden="true">person</mat-icon>
          <input type="text" formControlName="name" autocomplete="name" />
        </span>
        <span class="field__error" *ngIf="form.controls.name.touched && form.controls.name.hasError('required')">
          Informe seu nome.
        </span>
        <span class="field__error" *ngIf="form.controls.name.touched && form.controls.name.hasError('minlength')">
          Informe pelo menos 2 caracteres.
        </span>
      </label>

      <label class="field">
        <span class="field__label">E-mail</span>
        <span class="field__control">
          <mat-icon aria-hidden="true">mail</mat-icon>
          <input type="email" formControlName="email" autocomplete="email" />
        </span>
        <span class="field__error" *ngIf="form.controls.email.touched && form.controls.email.hasError('required')">
          Informe seu e-mail.
        </span>
        <span class="field__error" *ngIf="form.controls.email.touched && form.controls.email.hasError('email')">
          Informe um e-mail valido.
        </span>
      </label>

      <label class="field">
        <span class="field__label">Senha</span>
        <span class="field__control">
          <mat-icon aria-hidden="true">lock</mat-icon>
          <input
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
          />
        <button
          class="field__toggle"
          type="button"
          (click)="hidePassword = !hidePassword"
          [attr.aria-label]="hidePassword ? 'Mostrar senha' : 'Ocultar senha'"
        >
          <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        </span>
        <span class="field__error" *ngIf="form.controls.password.touched && form.controls.password.hasError('required')">
          Informe sua senha.
        </span>
        <span class="field__error" *ngIf="form.controls.password.touched && form.controls.password.hasError('minlength')">
          A senha precisa ter pelo menos 6 caracteres.
        </span>
      </label>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button mat-flat-button color="primary" type="submit" [disabled]="loading">
        <mat-icon>{{ mode === 'register' ? 'person_add' : 'login' }}</mat-icon>
        {{
          loading
            ? mode === 'register'
              ? 'Criando...'
              : 'Entrando...'
            : mode === 'register'
              ? 'Criar conta'
              : 'Entrar'
        }}
      </button>

      <button mat-stroked-button type="button" class="demo-button" (click)="enterDemo()" [disabled]="loading">
        <mat-icon>preview</mat-icon>
        Acessar demo
      </button>
    </form>

  </mat-card>
</main>
